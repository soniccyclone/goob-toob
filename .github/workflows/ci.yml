name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe stamps the version into the jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Clojure
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.12.0.1527.sh | sudo bash -
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: clojure -M:test
      - name: Build client + uberjar (smoke)
        run: |
          npx shadow-cljs release client
          VERSION=$(git describe --tags) clojure -T:build uberjar

  tag:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: echo "tag=$(sh scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.tag != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "goob-toob $TAG"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"

  plans:
    # Re-render plans/*.org and publish to GitHub Pages
    # (https://soniccyclone.github.io/goob-toob/).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Install htmlize
        run: emacs --batch --eval "(progn (require 'package) (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t) (package-initialize) (package-refresh-contents) (package-install 'htmlize))"
      - name: Build site
        run: bash scripts/build-plans-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gen/www
      - id: deploy
        uses: actions/deploy-pages@v4
