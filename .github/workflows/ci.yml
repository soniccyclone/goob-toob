name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run for its previous commit; pushes to
# main never cancel each other (the tag job must see every one).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe stamps the version into the jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Clojure
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install-1.12.0.1527.sh | sudo bash -
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: clojure -M:test
      - name: Build client + uberjar (smoke)
        run: |
          npx shadow-cljs release client
          VERSION=$(git describe --tags) clojure -T:build uberjar

  e2e-image:
    # The e2e image (Playwright's image + ffmpeg, Java, Clojure, deps) is
    # built once per change to its inputs and pushed to GHCR; the matrix
    # legs below run inside it and never touch apt.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${{ github.repository_owner }}/goob-toob-e2e:${{ hashFiles('container/Containerfile.e2e', 'deps.edn', 'package-lock.json', 'e2e/package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: have
        run: |
          if docker manifest inspect "${{ steps.name.outputs.image }}" >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.have.outputs.have == 'false'
        run: |
          docker build -f container/Containerfile.e2e -t "${{ steps.name.outputs.image }}" .
          docker push "${{ steps.name.outputs.image }}"

  e2e:
    needs: [test, e2e-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.e2e-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    strategy:
      fail-fast: false
      # One runner per (project, group). The journeys are ~9 min of
      # wall-clock sampling per project by design; a runner costs ~1.5 min
      # to cold start, so two balanced groups per project (~4.5 min each)
      # is the sweet spot: four runners, ~6 min wall, not an explosion of
      # jobs. The groups are spec files, totals balanced from the metrics;
      # the guard step fails the job if a spec file is in neither group.
      matrix:
        project: [chromium, chromium-lenient]
        group: [a, b]
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: npx shadow-cljs release client e2e
      - name: Journeys
        working-directory: e2e
        run: |
          export GOOB_E2E_STORAGE="$RUNNER_TEMP/goob"
          mkdir -p "$GOOB_E2E_STORAGE"
          case "${{ matrix.group }}" in
            a) SPECS="sync-policy host-and-viewer control lobby-admin-chat" ;;
            b) SPECS="playlists autoplay resilience telemetry" ;;
          esac
          ALL="sync-policy host-and-viewer control lobby-admin-chat playlists autoplay resilience telemetry"
          for f in out/*.js; do
            n=$(basename "$f" .js)
            case "$n" in config|setup) continue ;; esac
            case " $ALL " in *" $n "*) ;; *) echo "spec $n is in no e2e group (ci.yml)"; exit 1 ;; esac
          done
          npx playwright test -c out/config.js --project=${{ matrix.project }} $SPECS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.group }}
          path: |
            e2e/metrics
            e2e/report
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.group }}-test-results
          path: e2e/test-results
      - if: always()
        run: if [ -f e2e/metrics/summary.md ]; then cat e2e/metrics/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

  tag:
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        run: echo "tag=$(sh scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.tag != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "goob-toob $TAG"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"

  plans:
    # Re-render plans/*.org and publish to GitHub Pages
    # (https://soniccyclone.github.io/goob-toob/).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Install htmlize
        run: emacs --batch --eval "(progn (require 'package) (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t) (package-initialize) (package-refresh-contents) (package-install 'htmlize))"
      - name: Build site
        run: bash scripts/build-plans-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gen/www
      - id: deploy
        uses: actions/deploy-pages@v4
