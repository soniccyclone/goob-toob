# Desktop release builds: Linux AppImage + Windows NSIS installer, published
# to sr.ht pages. Run manually on a tag:
#   git tag v0.1.0 && git push --follow-tags
#   hut builds submit .builds/release.yml
image: fedora/latest
oauth: pages.sr.ht/PAGES:RW
packages:
- java-25-openjdk-headless
- nodejs
- npm
- wine
- unzip
- which
branches: master
tags: true
environment:
  site: nathanb.srht.site
  subdir: /goob-toob-releases
tasks:
- setup: |
    curl -fsSL https://download.clojure.org/install/linux-install-1.12.0.1527.sh | sudo bash -
- build-client: |
    cd goob-toob
    npm ci --no-audit --no-fund
    npx shadow-cljs release client
- build-server: |
    cd goob-toob
    clojure -T:build uberjar
- vendor: |
    cd goob-toob
    sh scripts/fetch-vendor.sh all
- package-linux: |
    cd goob-toob/desktop
    npm install --no-audit --no-fund
    npx electron-builder --linux AppImage
- package-windows: |
    cd goob-toob/desktop
    # NSIS needs wine; if the installer build ever breaks, ship the portable
    # zip instead so Windows users always get something
    npx electron-builder --win nsis || npx electron-builder --win zip
- stage: |
    cd goob-toob
    mkdir -p gen/releases
    cp desktop/dist/goob-toob.AppImage        gen/releases/goob-toob-linux-x86_64.AppImage
    if [ -f desktop/dist/goob-toob-setup.exe ]; then
      cp desktop/dist/goob-toob-setup.exe     gen/releases/goob-toob-win-x64-setup.exe
    else
      cp "$(ls desktop/dist/*-win-x64.zip | head -1)" gen/releases/goob-toob-win-x64-portable.zip
    fi
- publish: |
    cd goob-toob
    # only tag builds publish; branch pushes just prove the pipeline works
    git describe --tags --exact-match >/dev/null 2>&1 || { echo "not a tag; skipping publish"; exit 0; }
    VERSION=$(git describe --tags)
    cat > gen/releases/index.html <<EOF
    <!doctype html>
    <html><head><meta charset="utf-8"><title>goob-toob downloads</title></head>
    <body style="font-family:system-ui,sans-serif;background:#07231F;color:#8FE032;padding:3rem">
    <h1>goob-toob $VERSION</h1>
    <p>watch-together parties on your own box</p>
    <ul style="line-height:2">
      <li><a style="color:#1FC8DB" href="goob-toob-win-x64-setup.exe">Windows installer</a>
          (SmartScreen will squint — no code signing; "More info → Run anyway")</li>
      <li><a style="color:#1FC8DB" href="goob-toob-linux-x86_64.AppImage">Linux AppImage</a>
          (chmod +x and run)</li>
    </ul>
    <p><a style="color:#1FC8DB" href="https://git.sr.ht/~nathanb/goob-toob">source</a></p>
    </body></html>
    EOF
    cd gen/releases
    tar -cvz . > "$HOME/site.tar.gz"
    hut pages publish -d "$site" -s "$subdir" "$HOME/site.tar.gz"
