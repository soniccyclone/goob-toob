image: alpine/edge
oauth: pages.sr.ht/PAGES:RW
packages:
- emacs-nox
- hut
- python3
branches: master
environment:
  site: nathanb.srht.site
  subdir: /goob-toob-plans
tasks:
- htmlize: |
    emacs --batch --eval "(progn (require 'package) (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t) (package-initialize) (package-refresh-contents) (package-install 'htmlize))"
- build: |
    cd goob-toob
    sh scripts/build-plans-site.sh
- package: |
    cd goob-toob/gen/www
    tar -cvz . > "$HOME/site.tar.gz"
- upload: |
    hut pages publish -d "$site" -s "$subdir" "$HOME/site.tar.gz"
